<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watchtower Dashboard</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1220;color:#e9eef8}body{max-width:1180px;margin:0 auto;padding:28px}header,.tools,.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:28px;margin:0}small,.muted{color:#a6b1c5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:25px 0}.card,.panel{background:#172137;border:1px solid #30405d;border-radius:14px;padding:18px}.number{font-size:30px;font-weight:750}button{background:#345ee8;color:white;border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:650}button:disabled{opacity:.5;cursor:wait}.danger{background:#a63c46}.secondary{background:#30405d}.panel{margin:18px 0}table{border-collapse:collapse;width:100%}td,th{padding:13px 8px;text-align:left;border-bottom:1px solid #30405d}td{word-break:break-word}#error{color:#ffb4b4;white-space:pre-wrap}#feedback{color:#addcbd}pre{white-space:pre-wrap;max-height:350px;overflow:auto}button:focus-visible{outline:3px solid #d9e6ff}@media(max-width:650px){table{font-size:13px}td,th{padding:9px 3px}} 
</style></head><body>
<header><div><h1>Watchtower Dashboard</h1><small>Container tracking and update operations</small></div><div class="tools"><button class="secondary" id="refresh">Refresh</button><button id="check">Check updates</button></div></header>
<p id="error" role="alert"></p><p id="feedback" role="status"></p>
<div class="cards"><div class="card"><div class="muted">Watched containers</div><div class="number" id="count">—</div></div><div class="card"><div class="muted">Updates found in last check</div><div class="number" id="updates">—</div></div><div class="card"><div class="muted">Last refresh</div><div id="last">—</div></div></div>
<section class="panel"><h2>Containers</h2><div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Image</th><th>Status</th><th>Actions</th></tr></thead><tbody id="containers"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></section>
<section class="panel"><div class="row"><h2>Watchtower history</h2><button class="secondary" id="history-refresh">Reload</button></div><small>Upstream in-memory history; persistence is planned for a later phase.</small><pre id="history">Loading…</pre></section>
<script>
const $=id=>document.getElementById(id);
const results=new Map();
async function api(path,method='GET'){const response=await fetch('/api/'+path,{method,headers:method==='POST'?{'X-Requested-With':'WatchtowerDashboard'}:{},cache:'no-store'});const body=await response.text();if(!response.ok)throw Error(body||('HTTP '+response.status));try{return JSON.parse(body)}catch{return {message:body}}}
function busy(button,promise){button.disabled=true;return promise.finally(()=>button.disabled=false)}
function showError(e){$('error').textContent=String(e.message||e)}
function setFeedback(t){$('feedback').textContent=t;$('error').textContent=''}
function cell(row,value){let c=row.insertCell();c.textContent=value==null?'—':String(value);return c}
async function refresh(){try{let data=await api('containers');let containers=data.containers||[];let tbody=$('containers');tbody.replaceChildren();for(const item of containers){const name=item.name||item.Name||'';const image=item.image||item.Image||'';const row=tbody.insertRow();cell(row,name);cell(row,image);const status=results.get(name);cell(row,status===undefined?'Not checked':status?'Update available':'Up to date');const actions=row.insertCell();let b=document.createElement('button');b.textContent='Update';b.className='danger';b.disabled=!name;b.addEventListener('click',()=>updateOne(name,b));actions.append(b)}if(!containers.length){let tr=tbody.insertRow();let td=tr.insertCell();td.colSpan=4;td.textContent='No watched containers reported'}$('count').textContent=containers.length;$('last').textContent=new Date().toLocaleString()}catch(e){showError(e)}}
async function check(){setFeedback('Checking for updates…');try{let res=await api('check','POST');results.clear();for(let item of res.containers||[]){results.set(item.name,Boolean(item.update_available))}$('updates').textContent=[...results.values()].filter(Boolean).length;setFeedback('Check completed.');await refresh()}catch(e){showError(e)}}
async function updateOne(name,button){if(!confirm('Update container '+name+'? This may restart the service.'))return;await busy(button,(async()=>{setFeedback('Updating '+name+'…');try{let data=await api('update?name='+encodeURIComponent(name),'POST');setFeedback('Update request completed for '+name+'.');await refresh();await history()}catch(e){showError(e)}})())}
async function history(){try{let data=await api('history?limit=25');$('history').textContent=JSON.stringify(data,null,2)}catch(e){$('history').textContent='Unavailable: '+String(e.message||e)}}
$('refresh').onclick=()=>busy($('refresh'),refresh());$('check').onclick=()=>busy($('check'),check());$('history-refresh').onclick=()=>busy($('history-refresh'),history());refresh();history();
</script></body></html>
